# Copia la web de Cloudflare (langsushi.pages.dev), aplica parches pendientes y publica en GitHub Pages.
name: Publicar web (copia + parches)
on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          path: repo
      - name: Descargar la web de Cloudflare
        run: |
          set -e
          ORIGEN=https://langsushi.pages.dev
          mkdir -p site && cd site
          curl -fsSL --retry 3 "$ORIGEN/files.txt" -o ../files.txt
          while read -r f; do
            [ -z "$f" ] && continue
            mkdir -p "$(dirname "$f")"
            curl -fsSL --retry 3 "$ORIGEN/$f" -o "$f"
          done < ../files.txt
          echo 'window.LC_API = "https://langsushi-reservas.langcitysushi.workers.dev/api";' > config.js
          echo "langsushi.es" > CNAME
          touch .nojekyll
          test -s index.html && test -s carta/index.html
      - name: Aplicar parches
        run: |
          for p in repo/patch_*.py; do [ -f "$p" ] && python3 "$p" site; done
          echo "Archivos: $(find site -type f | wc -l)"
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
          include-hidden-files: true
      # A veces GitHub tarda en registrar el artefacto recien subido y el
      # despliegue falla con "No artifacts named github-pages". Se reintenta.
      - id: intento1
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - name: Esperar antes de reintentar
        if: steps.intento1.outcome == 'failure'
        run: sleep 45
      - id: intento2
        if: steps.intento1.outcome == 'failure'
        uses: actions/deploy-pages@v5
      - id: publicar
        run: echo "page_url=${{ steps.intento1.outputs.page_url || steps.intento2.outputs.page_url }}" >> "$GITHUB_OUTPUT"
